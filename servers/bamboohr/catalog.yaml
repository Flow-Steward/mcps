revision: 2
title: BambooHR
description: >-
  Query BambooHR employees, reports, time off, hiring, goals, and permitted HR actions. Use employee
  and time-off information for HR questions and supported account actions. This beta requires an app
  registered in the BambooHR developer portal with the client callback and appropriate permissions.
  An administrator must enable AI Connectors for the intended users.
category: hr
website_url: https://www.bamboohr.com
help_url: https://documentation.bamboohr.com/docs/mcp-server
preview_note: Beta. Create an app in the BambooHR developer portal with the Flow Steward callback and
  mcp plus required entity scopes. Admin must enable AI Connectors for the intended audience.
keywords:
- BambooHR
official:
  vendor: BambooHR
  evidence_url: https://documentation.bamboohr.com/docs/mcp-server
remotes:
- id: default
  label: BambooHR
  url: https://{subdomain}.bamboohr.com/api/mcp
  allowed_hosts:
  - '*.bamboohr.com'
  user_defined_host: false
  auth:
    mode: oauth2
    client_registration: user_supplied
    requested_scopes:
    - mcp
    - employees
    authorization_parameters: {}
    refresh_token_required: false
    setup_url: https://documentation.bamboohr.com/docs/mcp-server
