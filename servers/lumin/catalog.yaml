revision: 1
title: Lumin
description: Upload documents, send and track e-signature requests, and convert Markdown to PDF in Lumin.
category: documents
website_url: https://www.luminpdf.com
help_url: https://developers.luminpdf.com
remotes:
- id: default
  label: Lumin
  url: https://mcp.luminpdf.com/mcp
  allowed_hosts:
  - mcp.luminpdf.com
  auth:
    mode: oauth2
    client_registration: dcr
    requested_scopes:
    - openid
    - offline_access
    - profile.read
    - settings.configure
    - pdf:files.read
    - sign:requests.read
    - pdf:circles.read
    - sign:requests
    - pdf:files
    - workspaces.read
    - templates.read
    - templates
    - agreements
