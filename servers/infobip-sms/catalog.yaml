# Reviewed 2026-10-10: https://www.infobip.com/docs/mcp
# Infobip runs one MCP server per product (e.g. /sms, /whatsapp, /voice, /2fa, /people, /search); this entry is SMS only. OAuth 2.1 or API key header 'Authorization: App <key>' (key needs sms:message:send scope). Docs mark provisioning as early access. Streamable HTTP; /sse suffix for SSE.
