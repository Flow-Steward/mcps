description: "Add and search memories on your own MemOS deployment using the official HTTP MCP reference example backed by the MemOS Server API. Deploy the reference MCP example on your own HTTPS host and keep it on a private trusted endpoint: the example has no built-in authentication. It provides add and search operations, with no delete tool. The underlying MemOS Server API must be available to the deployment."
