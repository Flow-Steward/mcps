title: MongoDB (self-hosted MCP)
summary: Query, insert, update and delete MongoDB documents through your own HTTPS MCP gateway.
description: >-
  Query, insert, update and delete MongoDB documents through your own HTTPS MCP gateway. Requires a self-hosted MongoDB MCP HTTP service behind an authenticated TLS reverse proxy. Available operations depend on configured MongoDB roles and read-only mode. This connection is not the Atlas Managed MCP service.
