revision: 3
title: Typeform
description: "Create and edit Typeform forms, read responses and insights, and manage workspaces and webhooks from an AI assistant. Use form and response data to maintain questionnaires and analyze collected answers, with workspace and webhook management for the surrounding workflow. Choose the endpoint matching your account’s hosting region. The connection uses OAuth client metadata and PKCE."
