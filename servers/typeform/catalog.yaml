# Reviewed 2026-10-29: https://www.typeform.com/developers/mcp/
# Regional endpoints and client metadata registration documented by Typeform; OAuth discovery checked without account access.
revision: 2
title: Typeform
description: Create and edit Typeform forms, read responses and insights, and manage
  workspaces and webhooks from an AI assistant.
category: marketing
website_url: https://www.typeform.com
help_url: https://www.typeform.com/developers/mcp/
keywords:
- Forms
- Surveys
official:
  vendor: Typeform
  evidence_url: https://www.typeform.com/developers/mcp/
remotes:
- id: default
  label: Typeform
  url: https://api.typeform.com/mcp
  allowed_hosts:
  - api.typeform.com
  auth:
    mode: oauth2
    client_registration: client_metadata
    requested_scopes:
    - accounts:read
    - automations:read
    - automations:write
    - contacts:read
    - contacts:write
    - forms:read
    - forms:write
    - pages:read
    - pages:write
    - responses:read
    - responses:write
    - insights:read
    - webhooks:read
    - webhooks:write
    - workspaces:read
    - workspaces:write
    - offline_access
- id: eu
  label: Typeform — EU-hosted account
  url: https://api.eu.typeform.com/mcp
  allowed_hosts:
  - api.eu.typeform.com
  auth:
    mode: oauth2
    client_registration: client_metadata
    requested_scopes:
    - accounts:read
    - automations:read
    - automations:write
    - contacts:read
    - contacts:write
    - forms:read
    - forms:write
    - pages:read
    - pages:write
    - responses:read
    - responses:write
    - insights:read
    - webhooks:read
    - webhooks:write
    - workspaces:read
    - workspaces:write
    - offline_access
- id: eu-stack
  label: Typeform — separate EU stack
  url: https://api.typeform.eu/mcp
  allowed_hosts:
  - api.typeform.eu
  auth:
    mode: oauth2
    client_registration: client_metadata
    requested_scopes:
    - accounts:read
    - automations:read
    - automations:write
    - contacts:read
    - contacts:write
    - forms:read
    - forms:write
    - pages:read
    - pages:write
    - responses:read
    - responses:write
    - insights:read
    - webhooks:read
    - webhooks:write
    - workspaces:read
    - workspaces:write
    - offline_access
preview_note: Choose the endpoint matching your Typeform account hosting. OAuth client
  metadata and PKCE are used; offline access supports token refresh.
