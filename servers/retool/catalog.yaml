# Reviewed: https://docs.retool.com/org-users/guides/mcp
# Public beta; available on all Cloud plans and on self-hosted Retool 4.0.0+ (same requirements as the new app-building experience). OAuth 2.0 only, no token auth documented. Probe of example.retool.com confirmed RFC 8414 metadata on the instance with a registration_endpoint (/api/oauth2/register), scopes mcp:read/mcp:write/mcp:admin, and a 401 from /mcp pointing to the protected-resource metadata. 
