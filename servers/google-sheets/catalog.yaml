# Google Workspace MCP (Developer Preview). Not in the MCP Registry, so server.json is written here.
# Needs the Developer Preview Program, a Google Cloud project with the MCP service enabled,
# and the user's own OAuth client (Google offers no dynamic client registration).
# Scopes and authorization parameters carried over unchanged from Flow Steward's former template.
revision: 1
title: Google Sheets
description: 'Read and update Google Sheets spreadsheets: look up ranges, append rows, and write values
  back.'
category: data
website_url: https://workspace.google.com
help_url: https://developers.google.com/workspace/guides/configure-mcp-servers
preview_note: Developer Preview
official:
  vendor: Google
  evidence_url: https://developers.google.com/workspace/guides/configure-mcp-servers
remotes:
- id: default
  label: Google Sheets
  url: https://sheetsmcp.googleapis.com/mcp/v1
  allowed_hosts:
  - sheetsmcp.googleapis.com
  auth:
    mode: oauth2
    client_registration: user_supplied
    requested_scopes:
    - https://www.googleapis.com/auth/drive.readonly
    - https://www.googleapis.com/auth/drive.file
    - https://www.googleapis.com/auth/spreadsheets.readonly
    - https://www.googleapis.com/auth/spreadsheets
    authorization_parameters:
      access_type: offline
      prompt: consent
      include_granted_scopes: 'true'
    refresh_token_required: true
    setup_url: https://developers.google.com/workspace/guides/configure-mcp-servers
