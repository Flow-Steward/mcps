# Reviewed: https://help.activecampaign.com/hc/en-us/articles/22566179229596
# Vendor help article (Cloudflare-blocked to automated fetch) says to copy the account-unique Remote MCP URL from Settings > Developer; the option reportedly appears only when ActiveCampaign branding is On. URL pattern comes from a secondary source plus an earlier live probe: the per-account host returned 401 with protected-resource metadata, and the same-host authorization server exposes DCR at /ap
revision: 1
title: ActiveCampaign
description: Manage ActiveCampaign contacts, lists, tags, deals and automations through the account-specific ActiveCampaign
  MCP server.
category: marketing
website_url: https://www.activecampaign.com/
help_url: https://help.activecampaign.com/hc/en-us/articles/22566179229596
keywords:
- Email marketing
- Marketing automation
remotes:
- id: default
  label: ActiveCampaign
  url: https://{account}.activehosted.com/api/agents/mcp/http
  allowed_hosts:
  - '*.activehosted.com'
  field_labels:
    account: ActiveCampaign account name
  auth:
    mode: oauth2
    client_registration: dcr
    requested_scopes:
    - org:read
    - project:write
    - team:write
    - event:write
    setup_url: https://help.activecampaign.com/hc/en-us/articles/22566179229596
