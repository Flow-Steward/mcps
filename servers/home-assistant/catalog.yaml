revision: 2
title: Home Assistant
description: >-
  Read home device states and run the Home Assistant tools your administrator exposes. Use exposed
  device information and tools for home automation through your own Home Assistant instance. Enable
  the MCP integration, configure its external HTTPS address and permitted tools or accounts, and
  ensure Flow Steward can reach that address. Available actions depend on the administrator’s
  configuration.
category: it
website_url: https://www.home-assistant.io
help_url: https://www.home-assistant.io/integrations/mcp_server/
preview_note: Enable the MCP integration on your own HTTPS instance. Configure canonical external URL
  and which tools/accounts can connect. Flow Steward must be able to reach the instance.
keywords:
- Home Assistant
official:
  vendor: Home Assistant
  evidence_url: https://www.home-assistant.io/integrations/mcp_server/
remotes:
- id: default
  label: Home Assistant
  url: https://{instance_host}/api/mcp
  allowed_hosts: []
  user_defined_host: true
  auth:
    mode: oauth2
    client_registration: client_metadata
    requested_scopes: []
    authorization_parameters: {}
    refresh_token_required: false
    setup_url: https://www.home-assistant.io/integrations/mcp_server/
