  vendor: CircleCI
  evidence_url: https://circleci.com/docs/guides/toolkit/circleci-mcp-overview/
remotes:
- id: default
  label: CircleCI
  url: https://mcp.circleci.com/v1/mcp
  allowed_hosts:
  - mcp.circleci.com
  auth:
    mode: oauth2
    client_registration: dcr
