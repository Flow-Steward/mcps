# Reviewed 2026-10-10: https://docs.cloud.google.com/compute/docs/use-compute-engine-mcp
# User must create a Google OAuth client ID in their Google Cloud project, enable the MCP server per project (gcloud beta services mcp enable compute.googleapis.com), and hold roles/mcp.toolUser plus Compute IAM roles. Read-only scope https://www.googleapis.com/auth/compute.read-only is an option.
