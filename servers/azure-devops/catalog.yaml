revision: 1
title: Azure DevOps
description: Work with Azure DevOps projects, work items, repositories and pull requests through Microsoft
  hosted MCP.
category: developer-tools
website_url: https://azure.microsoft.com/products/devops
help_url: https://learn.microsoft.com/en-us/azure/devops/mcp-server/remote-mcp-server
preview_note: Public preview. Requires Entra-backed organization, tenant provisioning, custom app registration
  and delegated API permissions; use Flow Steward callback when registering the web client.
keywords:
- repositories
- work items
- pull requests
official:
  vendor: Microsoft
  evidence_url: https://learn.microsoft.com/en-us/azure/devops/mcp-server/remote-mcp-server
