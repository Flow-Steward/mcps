    - offline_access
    authorization_parameters: {}
    refresh_token_required: false
    setup_url: https://learn.microsoft.com/en-us/azure/devops/mcp-server/remote-mcp-server
- id: organization
  label: Organization
  url: https://mcp.dev.azure.com/{organization}
  allowed_hosts:
  - mcp.dev.azure.com
  user_defined_host: false
  auth:
    mode: oauth2
    client_registration: user_supplied
    requested_scopes:
    - https://mcp.dev.azure.com/.default
    - offline_access
    authorization_parameters: {}
    refresh_token_required: false
    setup_url: https://learn.microsoft.com/en-us/azure/devops/mcp-server/remote-mcp-server
