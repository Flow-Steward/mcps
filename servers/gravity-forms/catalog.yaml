revision: 2
title: Gravity Forms
description: >-
  Read forms and submissions and manage supported Gravity Forms operations on your WordPress site.
  Use the forms and submission data on the WordPress site you connect. Requires WordPress 6.9 or
  later, an enabled Gravity Forms MCP server and a dedicated WordPress user with an application
  password. Supply that site’s HTTPS hostname and user credentials.
category: cms
website_url: https://www.gravityforms.com
help_url: https://docs.gravityforms.com/connecting-to-the-mcp-server/
preview_note: Requires WordPress 6.9+, an enabled Gravity Forms MCP server and a dedicated user with an
  application password.
keywords:
- WordPress
- forms
- submissions
official:
  vendor: Gravity Forms
  evidence_url: https://docs.gravityforms.com/connecting-to-the-mcp-server/
remotes:
- id: default
  label: WordPress site
  url: https://{host}/wp-json/mcp/gravityforms
  allowed_hosts: []
  user_defined_host: true
  auth:
    mode: headers
