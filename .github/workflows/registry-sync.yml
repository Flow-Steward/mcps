name: Registry sync

# Refreshes listed servers and discovers new remote MCP candidates for review.
# Nothing is merged without review, and a change here never touches a
# connection a Flow Steward user already made.
on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: registry-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Test Registry sync and publication
        run: python -m pytest -q scripts
      - name: Refresh listed servers and discover new candidates
        run: python scripts/registry_sync.py sync --discover --candidate-limit 25 --report "$RUNNER_TEMP/report.md"
      - name: Refresh the single Registry review request
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_SYNC_REVIEWER: ${{ vars.REGISTRY_SYNC_REVIEWER || 'vasily-piksis' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/registry_sync_pr.py --report "$RUNNER_TEMP/report.md" \
            --reviewer "$REGISTRY_SYNC_REVIEWER"
