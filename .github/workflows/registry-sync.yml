name: Registry sync

# Reads the official MCP Registry once a day for the servers listed here and
# opens a pull request with what changed (new versions, deprecated, deleted).
# Nothing is merged without review, and a change here never touches a
# connection a Flow Steward user already made.
on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: registry-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Refresh listed servers from the Registry
        run: python scripts/registry_sync.py sync --report "$RUNNER_TEMP/report.md"
      - name: Open a pull request when something changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- servers; then
            echo "No Registry changes."
            exit 0
          fi
          branch="registry-sync/$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add servers
          git commit -m "Registry changes for listed servers"
          git push --force origin "$branch"
          {
            cat "$RUNNER_TEMP/report.md"
            echo
            echo "Check each change against the vendor's documentation before merging."
          } > "$RUNNER_TEMP/body.md"
          gh pr create --base main --head "$branch" \
            --title "Registry changes $(date -u +%Y-%m-%d)" \
            --body-file "$RUNNER_TEMP/body.md" || gh pr edit "$branch" --body-file "$RUNNER_TEMP/body.md"
